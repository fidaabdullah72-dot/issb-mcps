services:
  - type: web
    name: issb-green-sheet
    runtime: static
    buildCommand: ""
    staticPublishPath: ./site
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /config.js
        name: Cache-Control
        value: no-cache
